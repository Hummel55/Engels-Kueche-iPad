name: Engels Küche iPad IPA (iOS 12)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Projektdateien vollständig herstellen
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.0*.b64 | base64 -D > "$RUNNER_TEMP/engels-quellen.tar.xz"
          echo "24c73afc7822eb33a872481c0a794b84f68210fa7699d86817652e9deb59da59  $RUNNER_TEMP/engels-quellen.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/engels-quellen.tar.xz" --strip-components 1
          test -f EngelsKueche.xcodeproj/project.pbxproj
          test -f EngelsKueche/EngelsKueche.m
          test -f EngelsKueche/Info.plist

      - name: Projektdateien nach GitHub übernehmen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EngelsKueche EngelsKueche.xcodeproj Lenovo-Integration
          if ! git diff --staged --quiet; then
            git commit -m 'Import native iPad application sources'
            git push origin HEAD:main
          else
            echo 'Projektdateien sind bereits eingecheckt.'
          fi

      - name: Xcode prüfen
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: iOS 12 IPA ohne Developer-Konto bauen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project EngelsKueche.xcodeproj \
            -scheme EngelsKueche \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/EGDerived" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build
          APP="$RUNNER_TEMP/EGDerived/Build/Products/Release-iphoneos/EngelsKueche.app"
          test -f "$APP/EngelsKueche"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          mkdir -p "$RUNNER_TEMP/ipas/Payload"
          cp -a "$APP" "$RUNNER_TEMP/ipas/Payload/"
          (cd "$RUNNER_TEMP/ipas" && zip -qr "$GITHUB_WORKSPACE/EngelsKueche-iPad-iOS12.ipa" Payload)
          unzip -t "$GITHUB_WORKSPACE/EngelsKueche-iPad-iOS12.ipa" | tail -1

      - name: Installierbare IPA als ZIP herunterladen
        uses: actions/upload-artifact@v4
        with:
          name: EngelsKueche-iPad-iOS12-IPA
          path: EngelsKueche-iPad-iOS12.ipa
          retention-days: 7
